# Vastra self-host stack. `./install.sh` writes .env and picks the profiles.
#
#   docker compose up -d                              Vastra only (API keys or mock mode)
#   docker compose --profile gpu up -d                + the model servers on this NVIDIA box
#   docker compose --profile gpu --profile gateway up -d
#                                                     model servers for a Vastra on another
#                                                     machine, behind an authenticated TLS gateway
#   docker compose --profile tunnel up -d             + a Cloudflare tunnel
#
# GPU budget (one 96 GB-class card, #296): each vLLM process claims a fixed
# share of GPU memory, and vLLM's default is 90% each, so without the
# *_GPU_UTIL values below the second server fails to start. The defaults sum
# to 0.90; re-measure them on your card (#296 Phase 0) and adjust in .env.
# Servers start one after another (depends_on: service_healthy) because each
# one sizes itself from the memory that is free when it starts.
#
# MODEL_API_KEY (generated by ./install.sh) is the bearer every model server
# requires; the gateway refuses to start without it and GATEWAY_API_KEY.
#
# Model ports are never published, so nothing outside this host can reach a
# model server directly. Vastra reaches them over the `models` network; a
# Vastra on another machine goes through the gateway. The networks aren't
# `internal` because the servers download their weights on first start.

x-gpu: &gpu
  profiles: ["gpu"]
  restart: unless-stopped
  ipc: host
  networks: [models]
  volumes:
    - hf-cache:/root/.cache/huggingface
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-health: &health
  interval: 30s
  timeout: 10s
  retries: 5
  # First start downloads tens of GB of weights.
  start_period: 30m

services:
  closet:
    build: .
    restart: unless-stopped
    volumes:
      - ${VASTRA_DATA_DIR:-~/.closet}:/data
    env_file:
      - .env
    environment:
      - CLOSET_DATA_DIR=/data
      - NODE_ENV=production
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [default, models]
    # Mac: reach Ollama / LM Studio running natively on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Model servers (profile: gpu) ───────────────────────────────────────────

  # Try-on + Make Pretty (#352). ~34 GB peak in BF16.
  qwen-image:
    <<: *gpu
    build:
      context: deploy/gpu
      dockerfile: qwen-image.Dockerfile
    command:
      - Qwen/Qwen-Image-2.1
      - --omni
      - --port=8091
      - --gpu-memory-utilization=${QWEN_IMAGE_GPU_UTIL:-0.40}
      - --api-key=${MODEL_API_KEY:-}
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]

  # CLM's encoder: base Qwen3-8B with the pooling runner (not a retrieval
  # embedder). Only clm-serve talks to it, on its own network.
  clm-embed:
    <<: *gpu
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    networks: [clm]
    # Flags mirror CLM's reference serve_qwen3_8b.sh: the head was trained on
    # these embeddings (last-token pooling), and clm-serve asks for the model
    # by the name `qwen3-8b` (its --emb-model default).
    command:
      - --model=Qwen/Qwen3-8B
      - --served-model-name=qwen3-8b
      - --runner=pooling
      - --enforce-eager
      - --enable-prefix-caching
      - --max-num-seqs=32
      - --port=8090
      # Must match clm-serve --max-tokens below.
      - --max-model-len=${CLM_MAX_TOKENS:-2048}
      - --gpu-memory-utilization=${CLM_EMBED_GPU_UTIL:-0.20}
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
    depends_on:
      qwen-image: { condition: service_healthy }

  # Decisions (#351): TypeSafe /v1/systemone. Lightweight; no GPU of its own.
  clm:
    profiles: ["gpu"]
    restart: unless-stopped
    build:
      context: deploy/gpu
      dockerfile: clm.Dockerfile
    command:
      - --port=8700
      - --emb-url=http://clm-embed:8090/v1/embeddings
      - --emb-model=qwen3-8b
      - --max-tokens=${CLM_MAX_TOKENS:-2048}
      - --no-ui
    environment:
      CLM_API_KEY: ${MODEL_API_KEY:-}
    networks: [models, clm]
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health')"]
    depends_on:
      clm-embed: { condition: service_healthy }

  # Chat + vision: categorize, tag scan, detection, suggest, Ask (#289).
  qwen-vl:
    <<: *gpu
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --served-model-name=qwen3-vl-8b
      - --port=8001
      - --max-model-len=${QWEN_VL_MAX_LEN:-16384}
      - --gpu-memory-utilization=${QWEN_VL_GPU_UTIL:-0.22}
      # Tool calls for the Ask tab (Test connection reports tools separately).
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --api-key=${MODEL_API_KEY:-}
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
    depends_on:
      clm-embed: { condition: service_healthy }

  # Text + image embeddings in one space (#353).
  qwen-embed:
    <<: *gpu
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    command:
      - --model=Qwen/Qwen3-VL-Embedding-2B
      - --served-model-name=qwen3-vl-embedding-2b
      - --runner=pooling
      - --port=8002
      - --max-model-len=${QWEN_EMBED_MAX_LEN:-8192}
      - --gpu-memory-utilization=${QWEN_EMBED_GPU_UTIL:-0.08}
      - --api-key=${MODEL_API_KEY:-}
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
    depends_on:
      qwen-vl: { condition: service_healthy }

  # ── Gateway for a remote Vastra (profile: gateway) ─────────────────────────
  gateway:
    profiles: ["gateway"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    # An empty key would make the Caddyfile accept "Bearer " from anyone, so
    # refuse to start without both keys.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        [ -n "$$GATEWAY_API_KEY" ] && [ -n "$$MODEL_API_KEY" ]
        || { echo "gateway: set GATEWAY_API_KEY and MODEL_API_KEY in .env" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/gpu/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [models]

  # ── Cloudflare tunnel (profile: tunnel) ────────────────────────────────────
  # Named tunnel: set CLOUDFLARE_TUNNEL_TOKEN in .env and switch the command
  # to: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  # Quick tunnel (default): a random trycloudflare.com URL on every restart;
  # find it with `docker compose logs cloudflared | grep trycloudflare.com`.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - closet
    env_file:
      - .env
    command: tunnel --no-autoupdate --protocol http2 --url http://closet:3000 --metrics 0.0.0.0:2000

networks:
  default:
  models:
  clm:

volumes:
  hf-cache:
  caddy-data:
