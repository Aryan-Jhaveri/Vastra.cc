name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-core:
    name: Core & Backend Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npx tsc --noEmit

      - name: Run core + backend tests
        run: npm test
        env:
          CLOSET_DATA_DIR: /tmp/closet-test

  test-frontend:
    name: Frontend Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/transport/web/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/transport/web/app
        run: npm install --ignore-scripts

      - name: Run frontend tests
        working-directory: src/transport/web/app
        run: npm test
