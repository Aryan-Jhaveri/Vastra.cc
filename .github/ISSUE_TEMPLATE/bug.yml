name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Actual vs. expected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Transport (web / telegram / CLI), Node version, OS, any relevant env flags.
      placeholder: |
        Transport: web
        Node: 20.x
        OS: macOS 15
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ai
        - db
        - web
        - telegram
        - infra
        - docs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
